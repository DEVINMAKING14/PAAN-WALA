<!doctype html>
<html lang="en" class="bg-black text-white antialiased overflow-x-hidden select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- ✅ SEO & Social Sharing -->
    <title>Ramesh Paan Bhandar | A Living Indian Paan Shop Experience</title>
    <meta name="description" content="An interactive fullscreen Indian paan shop experience with cinematic atmosphere, tactile sound design, glassmorphic radio, and street culture storytelling." />
    <meta name="keywords" content="paan shop, banarasi paan, Indian street food, interactive experience, paan dukaan" />
    <meta name="author" content="Ramesh Paan Bhandar" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://your-app.vercel.app/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ramesh Paan Bhandar | A Living Indian Paan Shop Experience" />
    <meta property="og:description" content="Step into the most immersive Indian paan shop on the internet — sounds, scents, and stories from Banaras." />
    <meta property="og:url" content="https://your-app.vercel.app/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ramesh Paan Bhandar" />
    <meta name="twitter:description" content="An interactive fullscreen Indian paan shop experience." />

    <!-- 🔒 Security Headers (additional layer on top of vercel.json headers) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ⚡ Performance: Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://noembed.com" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Rozha+One&family=Teko:wght@400;500;600;700&family=Yatra+One&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Color (browser toolbar on mobile) -->
    <meta name="theme-color" content="#050505" />
  </head>
  <body class="bg-neutral-950 text-neutral-100 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
